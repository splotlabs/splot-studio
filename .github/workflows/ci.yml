#
# Full gate on the three supported desktop targets: `cargo xtask ci`.
#
# Cost: in a private repository, GitHub bills macOS and Windows minutes at a
# multiplier over Linux minutes. Runners are pinned to specific images rather
# than `-latest` so the OS floor changes only when this file does.
#
# No secrets, no release or signing steps, read-only token.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: windows-x86_64, runner: windows-2025 }
          - { name: macos-arm64, runner: macos-15 }
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The runner's preinstalled rustup installs exactly what rust-toolchain.toml
      # pins (channel, profile, components). rustup >= 1.28 needs this explicit step.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      # Slint's font stack (yeslogic-fontconfig-sys) needs fontconfig.pc at build
      # time. Wayland, X11, xkbcommon and GL are dlopen'd and need no -dev packages
      # (verified with only a dummy fontconfig.pc visible to pkg-config).
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev

      # The engine tests read media through the FFmpeg on PATH (development
      # opt-in SPLOT_STUDIO_SYSTEM_FFMPEG=1, set for every Cargo command by
      # .cargo/config.toml) and make their fixtures with it. These builds are
      # test tools only; nothing here is shipped. Doctor fails if they lack
      # the tools or fixture encoders.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Chocolatey puts launcher shims in its bin directory; killing a shim
      # may not kill the real ffmpeg, so the package's own bin directory goes
      # first on PATH.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $exe = Get-ChildItem (Join-Path $env:ChocolateyInstall "lib\ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found under the Chocolatey package" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'ffprobe.exe'))) { throw "ffprobe.exe is not beside $($exe.FullName)" }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName -hide_banner -version | Select-Object -First 1

      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ matrix.name }}-

      - name: Doctor
        run: cargo xtask doctor

      - name: Gate
        run: cargo xtask ci
