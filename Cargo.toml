[workspace]
members = ["crates/studio-domain", "crates/studio-engine", "crates/studio-app", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Bartosz Tomczyk <bartekplus@gmail.com>"]
repository = "https://github.com/splotlabs/splot-studio"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
studio-domain = { path = "crates/studio-domain", version = "0.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Engine only. Every splot-* crate stays on this one revision (AGENTS.md).
splot-core = { git = "https://github.com/splotlabs/splot", rev = "c1183fec4b81d72045d861973a9d8e563c6e9e2e" }
splot-decode = { git = "https://github.com/splotlabs/splot", rev = "c1183fec4b81d72045d861973a9d8e563c6e9e2e" }
splot-encode = { git = "https://github.com/splotlabs/splot", rev = "c1183fec4b81d72045d861973a9d8e563c6e9e2e" }
tempfile = "3.27"
splot-validate = { git = "https://github.com/splotlabs/splot", rev = "c1183fec4b81d72045d861973a9d8e563c6e9e2e" }
# GUI only (studio-app). Feature choices are explained in crates/studio-app/Cargo.toml.
slint = { version = "=1.19.0", default-features = false }
slint-build = "=1.19.0"
rfd = { version = "=0.18.0", default-features = false }

[workspace.lints.rust]
# Deny, not forbid: a reviewed FFI module must be able to opt out later
# (docs/planning/studio-v1/02-REPOSITORY-SETUP.md). Wholly safe crates add
# `#![forbid(unsafe_code)]` themselves.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Debug and test builds run the codec unoptimised otherwise: a 64x48 frame took
# about a second at preset 10. Debug assertions and overflow checks stay on;
# line tables alone keep the build shorter, as upstream does. Cargo has no
# glob for package names, so each splot-* crate is listed.
[profile.dev.package.splot-core]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.splot-decode]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.splot-encode]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.splot-parallel]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.splot-recon]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.splot-tables]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.splot-validate]
opt-level = 2
debug = "line-tables-only"
