[workspace]
members = ["crates/studio-domain", "crates/studio-engine", "crates/studio-app", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Bartosz Tomczyk <bartekplus@gmail.com>"]
repository = "https://github.com/splotlabs/splot-studio"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
studio-domain = { path = "crates/studio-domain", version = "0.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# GUI only (studio-app). Feature choices are explained in crates/studio-app/Cargo.toml.
slint = { version = "=1.19.0", default-features = false }
slint-build = "=1.19.0"
rfd = { version = "=0.18.0", default-features = false }

[workspace.lints.rust]
# Deny, not forbid: a reviewed FFI module must be able to opt out later
# (docs/planning/studio-v1/02-REPOSITORY-SETUP.md). Wholly safe crates add
# `#![forbid(unsafe_code)]` themselves.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
